services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - wallet-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    init: true
    stop_grace_period: 40s
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

volumes:
  wallet-postgres-data:
