services:
  - type: web
    name: wallet-transfer-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-transfer-db
          property: connectionString
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_POOL_MAX
        value: "40"

databases:
  - name: wallet-transfer-db
    plan: free
    databaseName: wallet
    user: wallet
    postgresMajorVersion: "16"
